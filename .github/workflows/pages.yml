name: Build station atlas and publish release branch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Reconvert every map, ignoring reusable output
        type: boolean
        default: false
  schedule:
    - cron: '23 4 1 * *' # First day of each month, 04:23 UTC
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      build: ${{ steps.check.outputs.build }}
      release: ${{ steps.check.outputs.release }}
      artifact_run: ${{ steps.check.outputs.artifact_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare upstream with the last published catalog
        id: check
        run: node scripts/check-upstream.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATLAS_FULL_REBUILD: ${{ inputs.full_rebuild || false }}
  build:
    needs: upstream
    if: needs.upstream.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore converted maps from release branch
        if: needs.upstream.outputs.release == 'true' && !inputs.full_rebuild
        uses: actions/checkout@v4
        with:
          ref: release
          path: .cache/baseline
          sparse-checkout: data
      - name: Recover completed conversion from an earlier run
        if: needs.upstream.outputs.release != 'true' && needs.upstream.outputs.artifact_run != '' && !inputs.full_rebuild
        uses: actions/download-artifact@v4
        with:
          name: station-atlas
          path: .cache/baseline
          run-id: ${{ needs.upstream.outputs.artifact_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin this build to the resolved upstream commit
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('atlas.config.json'));
          config.ref = process.env.ATLAS_UPSTREAM_COMMIT;
          writeFileSync('atlas.config.json', JSON.stringify(config, null, 2) + '\n');
          NODE
        env:
          ATLAS_UPSTREAM_COMMIT: ${{ needs.upstream.outputs.commit }}
      - name: Cache upstream checkout
        uses: actions/cache@v4
        with:
          path: .source
          key: splurt-source-${{ runner.os }}-${{ needs.upstream.outputs.commit }}
          restore-keys: splurt-source-${{ runner.os }}-
      - run: pnpm source
      - run: pnpm test
      - name: Convert only maps whose inputs changed
        run: |
          if [ "$ATLAS_FULL_REBUILD" = "true" ]; then
            pnpm export --full
          else
            pnpm export --incremental --adopt-baseline
          fi
        env:
          ATLAS_FULL_REBUILD: ${{ inputs.full_rebuild || false }}
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm build
        env:
          VITE_ATLAS_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Mark output as a plain static site
        run: touch dist/.nojekyll
      - name: Validate deployment size
        run: node scripts/check-size.mjs
      - name: Summarize incremental conversion
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report=JSON.parse(readFileSync('dist/data/build-report.json'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Map conversion\n\nRebuilt: ${report.rebuilt.join(', ')||'none'}\n\nReused: ${report.reused.join(', ')||'none'}\n\nUpstream files changed: ${report.changedFiles?.length??'baseline unavailable'}\n`);
          NODE
      - name: Save static build for review and recovery
        uses: actions/upload-artifact@v4
        with:
          name: station-atlas
          path: dist
          include-hidden-files: true
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: station-atlas
          path: dist
      - name: Publish static files to release branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: dist
          enable_jekyll: false
          force_orphan: true
          keep_files: false
      - name: Refresh Pages from the release branch when enabled
        uses: actions/github-script@v7
        with:
          script: |
            let site;
            try {
              ({ data: site } = await github.rest.repos.getPages(context.repo));
            } catch (error) {
              if (error.status === 404) {
                core.notice('Static release branch is ready. Enable Pages from release / (root) in repository settings.');
                return;
              }
              throw error;
            }
            if (site.source?.branch !== 'release' || site.source?.path !== '/') {
              core.notice('Select Deploy from a branch, release / (root), in Pages settings.');
              return;
            }
            // GITHUB_TOKEN pushes do not themselves trigger branch-based Pages builds.
            await github.rest.repos.requestPagesBuild(context.repo);
  # Station folders upload from a few parallel jobs; the site job then removes
  # obsolete objects and publishes the catalog and entry page last.
  publish-r2-maps:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: station-atlas
          path: dist
      - name: Install S3-compatible sync tool
        run: |
          version=1.75.2
          archive="rclone-v${version}-linux-amd64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "https://downloads.rclone.org/v${version}/$archive"
          curl --fail --silent --show-error --location --retry 3 --output SHA256SUMS "https://downloads.rclone.org/v${version}/SHA256SUMS"
          grep " $archive$" SHA256SUMS | sha256sum --check --strict
          unzip -q "$archive"
          sudo install -m 755 "rclone-v${version}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
      - name: Upload station files to R2
        run: node scripts/deploy-r2.mjs
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          R2_STAGE: maps
          R2_SHARD: ${{ matrix.shard }}
          R2_SHARDS: 4
  publish-r2:
    if: github.event_name != 'pull_request'
    needs: publish-r2-maps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: station-atlas
          path: dist
      - name: Install S3-compatible sync tool
        run: |
          version=1.75.2
          archive="rclone-v${version}-linux-amd64.zip"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" "https://downloads.rclone.org/v${version}/$archive"
          curl --fail --silent --show-error --location --retry 3 --output SHA256SUMS "https://downloads.rclone.org/v${version}/SHA256SUMS"
          grep " $archive$" SHA256SUMS | sha256sum --check --strict
          unzip -q "$archive"
          sudo install -m 755 "rclone-v${version}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
      - name: Publish site files to R2
        run: node scripts/deploy-r2.mjs
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          R2_STAGE: site
